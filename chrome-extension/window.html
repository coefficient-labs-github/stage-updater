<!DOCTYPE html>
<html>
  <head>
    <title>LinkedIn Outreach Assistant</title>
    <style>
      body {
        width: 350px; /* Fixed width for popup */
        margin: 0;
        padding: 16px;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
      }
      button {
        width: 100%;
        margin: 5px 0;
        padding: 8px;
        cursor: pointer;
      }
      .button-group {
        display: flex;
        gap: 8px;
        margin-top: 10px;
      }
      .button-group button {
        flex: 1;
        font-size: 14px;
        padding: 8px;
        border-radius: 4px;
      }
      .yes-button {
        background-color: #4caf50;
        color: white;
        border: none;
      }
      .no-button {
        background-color: #f44336;
        color: white;
        border: none;
      }
      .notes-section {
        margin-top: 12px;
      }
      textarea {
        width: 100%;
        height: 80px; /* Slightly smaller for popup */
        max-height: 120px;
        margin: 10px 0;
        padding: 8px;
        box-sizing: border-box;
        resize: vertical;
        border: 1px solid #ddd;
        border-radius: 4px;
      }
      p {
        margin: 5px 0;
      }
      label {
        font-size: 14px;
        color: #666;
      }
      #getNextContact {
        background-color: #2196f3;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 14px;
      }
      .loading-spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 20px auto;
        border-width: 3px;
      }
      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }
      #loadingScreen {
        text-align: center;
        padding: 20px;
      }
      h2 {
        font-size: 18px;
        margin-top: 0;
        margin-bottom: 12px;
      }
      #setupScreen,
      #mainScreen,
      #loadingScreen {
        transition: opacity 0.2s ease-in-out;
      }
      .scroll-container {
        max-height: 500px;
        overflow-y: auto;
      }
      .input-group {
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <div class="scroll-container">
      <div id="loadingScreen">
        <div class="loading-spinner"></div>
        <p>Loading...</p>
      </div>

      <div id="setupScreen" style="display: none">
        <h2>LinkedIn Outreach Assistant</h2>
        <p id="setupMessage">Please enter your authentication key:</p>
        <div
          id="errorMessage"
          style="display: none; color: red; margin-bottom: 8px"
        ></div>
        <div class="input-group">
          <label for="apiKey">Authentication Key:</label>
          <input
            type="password"
            id="apiKey"
            placeholder="Enter your key here"
          />
        </div>
        <button id="saveConfig">Start Using Extension</button>
      </div>

      <div id="mainScreen" style="display: none">
        <button id="getNextContact">Get Next Contact</button>
        <div id="contactInfo"></div>
      </div>
    </div>
    <script src="window.js" type="module"></script>
  </body>
</html>
